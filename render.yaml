# Render Blueprint, free plan: the web app and Postgres.
# Deploy: Render Dashboard → New → Blueprint → pick this repo. Fill the `sync: false` secrets when prompted.
#
# Free web services sleep after about 15 idle minutes, and the free plan has no background workers,
# so the background jobs (auto-release, PayPal holds, payout retries, reconciliation...) run from
# .github/workflows/jobs.yml, which calls /api/cron/all every 14 minutes and keeps the site awake.
# To run them on Render instead, add a worker running `npx tsx scripts/run-jobs.ts --loop` (paid).
services:
  - type: web
    name: paydrop-web
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        fromDatabase:
          name: paydrop-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CURRENCY
        value: USD
      - key: FX_INR_PER_USD
        value: "84"
      - key: DEMO_PAYOUT_EMAIL
        sync: false
      # Kernel runs the AI work checker's browser in the cloud and records replays.
      - key: KERNEL_API_KEY
        sync: false
      - key: ELASTIC_URL
        sync: false
      - key: ELASTIC_API_KEY
        sync: false
      - key: ZAPIER_SECRET
        generateValue: true
      - key: ZAPIER_HOOK_URL
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
      - key: NEXT_PUBLIC_AG_GRID_LICENSE_KEY
        sync: false
      - key: CRON_SECRET
        generateValue: true
      - key: ADMIN_SECRET
        generateValue: true

databases:
  - name: paydrop-db
    plan: free
    databaseName: paydrop
